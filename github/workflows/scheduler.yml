name: Trench Report — Auto Publish

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Run Trench Report engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_and_publish.py

      - name: Commit and push updated site
        run: |
          git config user.name "Trench Report Bot"
          git config user.email "bot@trenchreport.com"
          git add index.html headline_state.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
